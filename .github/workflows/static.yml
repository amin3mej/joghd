name: Static

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/setup

      - name: Install SwiftLint
        run: |
          VERSION="$(awk '$1 == "swiftlint" { print $2; exit }' .tool-versions)"
          SHA256="c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${VERSION}/portable_swiftlint.zip"
          echo "${SHA256}  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip swiftlint
          sudo install -m 0755 swiftlint /usr/local/bin/swiftlint
          swiftlint version

      - name: Check formatting
        run: xcrun swift-format lint --strict --recursive Joghd JoghdTests

      - name: Lint
        run: swiftlint lint --strict

      - name: Check import layers
        run: scripts/check-import-layer.sh
