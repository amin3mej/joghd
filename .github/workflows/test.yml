name: Test

# Reusable component: runs the app's unit tests against the project generated
# by the `setup` workflow. Requires `setup` to have run first in the same
# workflow run, so the `generated-project` artifact is available.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          XCODE_VERSION="$(jq -r .xcode .github/ci/versions.json)"
          DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app"
          echo "Selecting ${DEVELOPER_DIR}"
          sudo xcode-select -s "${DEVELOPER_DIR}"
          xcodebuild -version

      - name: Download generated project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-project

      - name: Run tests
        run: |
          xcodebuild test \
            -project Joghd.xcodeproj \
            -scheme Joghd \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
