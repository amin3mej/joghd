name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  setup:
    name: setup
    uses: ./.github/workflows/setup.yml
    permissions:
      contents: read

  test:
    name: test
    needs: setup
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          XCODE_VERSION="$(awk '$1 == "xcode" { print $2; exit }' .tool-versions)"
          DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app"
          echo "Selecting ${DEVELOPER_DIR}"
          sudo xcode-select -s "${DEVELOPER_DIR}"
          xcodebuild -version

      - name: Download generated project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: generated-project
          path: Joghd.xcodeproj

      - name: Run tests
        run: |
          xcodebuild test \
            -project Joghd.xcodeproj \
            -scheme Joghd \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
