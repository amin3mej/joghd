name: Setup

on:
  workflow_call:

permissions:
  contents: read

jobs:
  setup:
    name: setup
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          XCODE_VERSION="$(awk '$1 == "xcode" { print $2; exit }' .tool-versions)"
          DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app"
          echo "Selecting ${DEVELOPER_DIR}"
          sudo xcode-select -s "${DEVELOPER_DIR}"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          VERSION="$(awk '$1 == "xcodegen" { print $2; exit }' .tool-versions)"
          SHA256="4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip"
          echo "${SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo bash xcodegen/install.sh
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Upload generated project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: generated-project
          path: Joghd.xcodeproj
          if-no-files-found: error
